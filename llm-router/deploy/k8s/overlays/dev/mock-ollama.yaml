apiVersion: apps/v1
kind: Deployment
metadata:
  name: mock-ollama
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: mock-ollama
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mock-ollama
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: mock-ollama
          image: llm-router/mock-ollama:local
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 11434
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          readinessProbe:
            httpGet:
              path: /api/tags
              port: http
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: http
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: mock-ollama
spec:
  selector:
    app.kubernetes.io/name: mock-ollama
  ports:
    - name: http
      port: 11434
      targetPort: http
  type: ClusterIP
