name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  node:
    name: Node, contracts, UI
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.0'
          cache: npm
      - run: npm ci
      - run: npm run contracts:check
      - run: npm test
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build

  rust:
    name: Rust router
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.85.1
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: router -> target
      - run: cargo fmt --manifest-path router/Cargo.toml -- --check
      - run: cargo test --manifest-path router/Cargo.toml --locked
      - run: cargo clippy --manifest-path router/Cargo.toml --all-targets --locked -- -D warnings

  compose-smoke:
    name: Compose mock integration
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.0'
          cache: npm
      - run: npm ci
      - name: Check Compose configuration
        run: docker compose -f docker-compose.yml -f deploy/docker-compose.mock-router.yml config --quiet
      - name: Build and start mock stack
        run: docker compose -f docker-compose.yml -f deploy/docker-compose.mock-router.yml up --build -d --wait
      - name: Exercise API, SSE and cache
        run: deploy/scripts/compose-smoke.sh
      - name: Tear down
        if: always()
        run: docker compose -f docker-compose.yml -f deploy/docker-compose.mock-router.yml down -v
