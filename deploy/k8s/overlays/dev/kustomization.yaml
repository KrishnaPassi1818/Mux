apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: llm-router
resources:
  - ../../base
  - mock-ollama.yaml
images:
  - name: llm-router/router
    newTag: local
  - name: llm-router/gateway
    newTag: local
  - name: llm-router/frontend
    newTag: local
patches:
  - path: mock-router-env.patch.yaml
  - path: mock-benchmark-env.patch.yaml
