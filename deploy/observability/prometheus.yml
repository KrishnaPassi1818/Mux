global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: llm-router-rust
    metrics_path: /metrics
    static_configs:
      - targets: [router:8081]

  - job_name: llm-router-gateway
    metrics_path: /metrics
    static_configs:
      - targets: [gateway:3000]

  - job_name: nvidia-gpu
    metrics_path: /metrics
    static_configs:
      - targets: [gpu-exporter:9835]
